<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - 9th PoCo Scouts Inventory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .logo {
      width: 800px;
      max-width: 100%;
      margin-bottom: 25px;
      border-radius: 8px;
    }

    @media (max-width: 800px) {
      .logo {
        width: 800px;
      }
    }



    h2 {
      margin-bottom: 25px;
      color: #333;
      font-size: 22px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .login-btn {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: white;
      min-width: 140px;
    }

    .ms-btn {
      background-color: #0078D4; /* Microsoft blue */
    }

    .google-btn {
      background-color: #DB4437; /* Google red */
    }

    .yahoo-btn {
      background-color: #720E9E; /* Yahoo purple */
    }

    .login-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Group Crest -->
    <img src="9thPocoCrestNB.png" class="logo" alt="9th PoCo Scouts Crest">

    <h2>Sign in to 9th PoCo Scouts Group Equipment Inventory</h2>

    <div class="button-row">
      <button class="login-btn ms-btn" onclick="login('aad')">
        Microsoft
      </button>

      <button class="login-btn google-btn" onclick="login('google')">
        Google
      </button>

      <button class="login-btn yahoo-btn" onclick="alert('Yahoo login not yet implemented');">
        Yahoo
      </button>
    </div>

  </div>

  <script>
    function login(provider) {
      window.location.href = `/.auth/login/${provider}`;
    }
  </script>

</body>
</html>
