<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - 9th PoCo Scouts Inventory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .logo {
      width: 800px;
      max-width: 100%;
      margin-bottom: 25px;
      border-radius: 8px;
    }

    h2 {
      margin-bottom: 25px;
      color: #333;
      font-size: 46px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .login-btn {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: white;
      min-width: 140px;
    }

    .ms-btn {
      background-color: #0078D4;
    }

    .google-btn {
      background-color: #DB4437;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    /* Mobile improvements */
    @media (max-width: 800px) {

      body {
        padding: 10px !important;
      }

      .container {
        max-width: 100% !important;
        width: 100% !important;
        padding: 20px !important;
        border-radius: 12px !important;
      }

      .logo {
        width: 100% !important;
        max-width: 400px !important;
        margin-bottom: 20px !important;
      }

      h2 {
        font-size: 32px !important;
        margin-bottom: 20px !important;
      }

      .button-row {
        flex-direction: column !important;
        gap: 16px !important;
      }

      .login-btn {
        width: 100% !important;
        font-size: 22px !important;
        padding: 18px !important;
        min-width: unset !important;
      }
    }


  </style>
</head>
<body>

  <div class="container">

    <img src="9thPocoCrestNB.png" class="logo" alt="9th PoCo Scouts Crest">

    <h2>Sign in to 9th Port Coquitlam Scouts Group Equipment Inventory</h2>

    <div class="button-row">
      <button class="login-btn ms-btn" onclick="login('aad')">
        Microsoft Login (hotmail.com/ca/co.uk, outlook.com, live.com)
      </button>

      <button class="login-btn google-btn" onclick="login('google')">
        Google Login (gmail.com)
      </button>
    </div>

  </div>

  <script>
    function login(provider) {
      window.location.href = `/.auth/login/${provider}`;
    }
  </script>

</body>
</html>
